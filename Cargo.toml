[package]
name = "bitcoin_price_tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"

[dependencies]
axum = "0.8.1"
httpdate = "1.0.3"
hyper = { version = "1.8.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["service", "tokio"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.34.0", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tokio = { version = "1.43.0", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }

[dev-dependencies]
thirtyfour = { version = "0.36.3", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1.43.0", features = ["io-util", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
