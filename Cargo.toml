[package]
name = "bitcoin_price_tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
axum = "0.8.9"
httpdate = "1.0.3"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["service", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
thirtyfour = { version = "0.38.1", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1.54.1", features = ["io-util", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
