name: CI
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: docker.io/library/rust:1.85.1-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix tests/browser
      - run: npm exec --prefix tests/browser -- playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: docker.io/library/rust:1.94.0-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned RustSec scanner
        run: cargo +1.94.0 install cargo-audit --locked --version 0.22.2
      - run: cargo +1.94.0 audit --deny warnings
  npm-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix tests/browser
      - run: npm audit --prefix tests/browser --audit-level=low
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag btc-ci .
      - run: python3 scripts/verify_runtime.py --engine docker --image btc-ci
