name: CI
on:
  workflow_call:
    inputs:
      runtime:
        description: Build, verify and scan the runtime image
        type: boolean
        default: true
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: docker.io/library/rust:1.85.1-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix tests/browser
      - run: npm exec --prefix tests/browser -- playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: docker.io/library/rust:1.94.0-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned RustSec scanner
        run: cargo +1.94.0 install cargo-audit --locked --version 0.22.2
      - run: cargo +1.94.0 audit --deny warnings
  npm-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix tests/browser
      - run: npm audit --prefix tests/browser --audit-level=low
  runtime:
    if: inputs.runtime || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag btc-ci .
      - run: python3 scripts/verify_runtime.py --engine docker --image btc-ci
      - run: python3 scripts/check_image_exceptions.py
      - name: Scan final runtime image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: btc-ci
          grype-version: v0.118.0
          config: .grype.yaml
          severity-cutoff: high
          output-format: table
  published-image:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check_image_exceptions.py
      - name: Resolve the published image to its digest
        id: published
        run: |
          docker pull agaddy/bitcoin_price_tracker:latest
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' agaddy/bitcoin_price_tracker:latest)
          echo "image=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan the published digest
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.published.outputs.image }}
          grype-version: v0.118.0
          config: .grype.yaml
          severity-cutoff: high
          output-format: table
