name: Container

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      runtime: false

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a release from current master
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: agaddy/bitcoin_price_tracker
          tags: type=semver,pattern={{version}}

      - name: Build the candidate without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: btc-release-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the final runtime image
        run: python3 scripts/verify_runtime.py --engine docker --image btc-release-candidate

      - name: Scan the image that will be published
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: btc-release-candidate
          grype-version: v0.118.0
          config: .grype.yaml
          severity-cutoff: high
          output-format: table

      - name: Require a current advisory review
        run: python3 scripts/check_image_exceptions.py

      - name: Log in to Docker Hub after all checks pass
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: agaddy
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the checked image without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag btc-release-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
